<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导出中心 - GPM系统</title>
<link rel="stylesheet" href="_common/gpm.css">
<style>
  .export-dl{ color:#1869e1; cursor:pointer; }
  .export-dl.disabled{ color:#c0c4cc; cursor:not-allowed; }
</style>
</head>
<body>

<template id="page-body">
<div class="page" style="padding:0;display:flex;flex-direction:column;overflow:hidden;">
  <div class="panel" style="flex:1;display:flex;flex-direction:column;min-height:0;border:none;border-radius:0;">

    <!-- 视图切换 -->
    <div class="inner-tabs">
      <div class="tab-btn" data-view="self" onclick="switchView('self',this)">个人<span class="muted">（我的导出）</span></div>
      <div class="tab-btn active" data-view="all" onclick="switchView('all',this)">全量<span class="new-col-badge">新</span><span class="muted">（采购）</span></div>
    </div>

    <div class="alert alert-info" style="margin:12px 16px 0;">
      <span class="ico">ⓘ</span>
      <div>导出中心展示系统内的导出文件。<b>个人视图</b>＝仅当前登录人的导出记录；<b>全量视图</b>＝展示全量导出记录（含 <b>导出人 / 工号 / 研发部门</b>），<b>仅采购可见</b>（由数据权限约束）。下载按 <b>fileuploadId</b> 取件。<br>采购所需的「<b>累计登录次数</b>」「<b>最后登录时间</b>」复用现有登录痕迹（<code>scc_log_user_trace</code>），不新建页面。</div>
    </div>

    <div class="search-area" id="searchArea">
      <div class="search-form">
        <div class="search-item all-only"><label>导出人：</label><input type="text" id="qExporter" placeholder="姓名 / 账号"></div>
        <div class="search-item all-only"><label>工号：</label><input type="text" id="qEmpNo" placeholder="请输入工号"></div>
        <div class="search-item all-only"><label>研发部门：</label><input type="text" id="qDept" placeholder="请输入研发部门"></div>
        <div class="search-item"><label>菜单名称：</label><input type="text" id="qFunc" placeholder="请输入菜单名称"></div>
        <div class="search-item"><label>文件名称：</label><input type="text" id="qFile" placeholder="请输入文件名称"></div>
        <div class="search-actions">
          <button class="btn btn-primary" onclick="doSearch()">查询</button>
          <button class="btn btn-default" onclick="resetSearch()">重置</button>
        </div>
      </div>
    </div>

    <div class="table-toolbar">
      <button class="btn btn-default" onclick="showLoginInfo()">登录信息（累计登录次数 / 最后登录时间）</button>
      <div class="right"><span class="toolbar-note">共 <b id="totalText">0</b> 个文件</span></div>
    </div>

    <div class="table-wrap" style="flex:1;overflow:auto;min-height:0;">
      <table class="list-table">
        <thead><tr>
          <th style="width:46px;">序号</th>
          <th class="all-only" style="min-width:100px;">导出人<span class="new-col-badge">新</span></th>
          <th class="all-only" style="width:100px;">工号<span class="new-col-badge">新</span></th>
          <th class="all-only" style="min-width:120px;">研发部门<span class="new-col-badge">新</span></th>
          <th style="min-width:150px;">菜单名称</th>
          <th style="min-width:200px;">文件名称</th>
          <th style="width:90px;">文件大小</th>
          <th style="width:80px;">状态</th>
          <th style="width:150px;">创建时间</th>
          <th style="width:150px;">结束时间</th>
          <th style="width:80px;">操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="pagination-bar">
      <span class="muted">「个人 / 全量」由视图切换；全量视图仅采购可见。</span>
    </div>
  </div>
</div>
</template>

<script src="_common/gpm-layout.js"></script>
<script>
GpmLayout.init({
  activePage: 'exportCenter',
  breadcrumb: ['首页', '系统管理', '导出中心'],
  tabs: [
    { key:'home', label:'首页', closable:false },
    { key:'exportCenter', label:'导出中心' }
  ],
  activeTab: 'exportCenter'
});

/* mock：导出记录（全量） */
var rows = [
  { exporter:'冷丹丹', emp:'00130778', dept:'采购部',   func:'价格目录',     file:'价格目录导出_20260921.xlsx',   size:'2.3 MB',  status:'完成',  cdate:'2026-09-21 09:12', edate:'2026-09-21 09:13', me:true },
  { exporter:'孙倩',   emp:'00180123', dept:'采购部',   func:'物料维护',     file:'物料清单导出_20260920.xlsx',   size:'8.1 MB',  status:'完成',  cdate:'2026-09-20 16:40', edate:'2026-09-20 16:45', me:false },
  { exporter:'王慧芬', emp:'00120456', dept:'成本工程部', func:'成本分析报表', file:'部门达成情况_20260920.xlsx',   size:'1.2 MB',  status:'完成',  cdate:'2026-09-20 10:05', edate:'2026-09-20 10:06', me:false },
  { exporter:'刘德',   emp:'00150234', dept:'车身开发部', func:'成本分析报表', file:'零件成本明细_20260919.xlsx',   size:'12.6 MB', status:'完成',  cdate:'2026-09-19 14:22', edate:'2026-09-19 14:35', me:false },
  { exporter:'冷丹丹', emp:'00130778', dept:'采购部',   func:'在途成本',     file:'在途成本导出_20260918.xlsx',   size:'—',       status:'生成中', cdate:'2026-09-18 17:30', edate:'', me:true },
  { exporter:'周敏',   emp:'00190456', dept:'财务部',   func:'价格审批单',   file:'价格审批单_20260918.xlsx',     size:'640 KB',  status:'失败',  cdate:'2026-09-18 11:02', edate:'2026-09-18 11:02', me:false }
];
var view = 'all';   /* 默认演示「全量」视图 */
var filtered = rows.slice();

/* 登录信息（来源：用户登录痕迹 scc_log_user_trace） */
var LOGIN_INFO = [
  { user:'冷丹丹', emp:'00130778', count:326, last:'2026-09-21 09:10' },
  { user:'孙倩',   emp:'00180123', count:210, last:'2026-09-20 16:38' },
  { user:'王慧芬', emp:'00120456', count:488, last:'2026-09-20 10:02' }
];

function switchView(v, el){
  view = v;
  document.querySelectorAll('.inner-tabs .tab-btn').forEach(function(x){ x.classList.remove('active'); });
  if(el) el.classList.add('active');
  doSearch();
}
function doSearch(){
  var ex=document.getElementById('qExporter').value.trim(), emp=document.getElementById('qEmpNo').value.trim(),
      dp=document.getElementById('qDept').value.trim(), fn=document.getElementById('qFunc').value.trim(),
      fl=document.getElementById('qFile').value.trim();
  filtered = rows.filter(function(r){
    if(view==='self' && !r.me) return false;
    if(ex && r.exporter.indexOf(ex)<0) return false;
    if(emp && r.emp.indexOf(emp)<0) return false;
    if(dp && r.dept.indexOf(dp)<0) return false;
    if(fn && r.func.indexOf(fn)<0) return false;
    if(fl && r.file.indexOf(fl)<0) return false;
    return true;
  });
  render();
}
function resetSearch(){ ['qExporter','qEmpNo','qDept','qFunc','qFile'].forEach(function(id){document.getElementById(id).value='';}); doSearch(); }
function render(){
  var tb=document.getElementById('tbody'); tb.innerHTML='';
  filtered.forEach(function(r,i){
    var dl = r.status==='完成'
      ? '<span class="export-dl" onclick="downloadFile(\''+r.file+'\')">下载</span>'
      : '<span class="export-dl disabled">下载</span>';
    var stTag = '<span class="tag '+(r.status==='完成'?'tag-green':(r.status==='生成中'?'tag-blue':'tag-red'))+'">'+r.status+'</span>';
    var tr=document.createElement('tr');
    tr.innerHTML =
      '<td>'+(i+1)+'</td>'+
      '<td class="all-only text-left">'+r.exporter+'</td>'+
      '<td class="all-only">'+r.emp+'</td>'+
      '<td class="all-only text-left">'+r.dept+'</td>'+
      '<td class="text-left">'+r.func+'</td>'+
      '<td class="text-left">'+r.file+'</td>'+
      '<td>'+(r.size||'—')+'</td>'+
      '<td>'+stTag+'</td>'+
      '<td>'+r.cdate+'</td>'+
      '<td>'+(r.edate||'<span class="muted">—</span>')+'</td>'+
      '<td>'+dl+'</td>';
    tb.appendChild(tr);
  });
  document.querySelectorAll('.all-only').forEach(function(x){ x.style.display = (view==='all')? '' : 'none'; });
  document.getElementById('totalText').innerText=filtered.length;
}
function downloadFile(name){ alert('下载：'+name+'\n（原型占位，实际走 FILE_DOWNLOAD?fileuploadId=xxx）'); }
function showLoginInfo(){
  var s='登录信息（来源：用户登录痕迹 scc_log_user_trace）\n累计登录次数 = LOGIN_NUM；最后登录时间 = 最近一次 loginDate\n\n';
  LOGIN_INFO.forEach(function(x){ s += x.user+'（'+x.emp+'）：登录 '+x.count+' 次，最后登录 '+x.last+'\n'; });
  s += '\n支持按「起始 / 结束时间」筛选。';
  alert(s);
}

doSearch();
</script>
</body>
</html>
