<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车型项目管理 - GPM系统</title>
<link rel="stylesheet" href="_common/gpm.css">
<style>
  .proj-card{border:1px solid #ebeef5;border-radius:4px;margin-bottom:12px;overflow:hidden;}
  .proj-head{display:flex;align-items:center;gap:16px;padding:12px 16px;background:#fafafa;cursor:pointer;user-select:none;}
  .proj-head:hover{background:#f0f7ff;}
  .proj-head .pname{font-weight:bold;color:#303133;font-size:14px;}
  .proj-head .meta{font-size:12px;color:#909399;}
  .proj-head .expand-ico{margin-left:auto;color:#1869e1;}
  .proj-body{padding:0 16px 12px;border-top:1px solid #ebeef5;display:none;}
  .proj-card.open .proj-body{display:block;}
  .proj-card.open .expand-ico{transform:rotate(180deg);}
  .part-src{font-size:11px;padding:1px 6px;border-radius:3px;}
  .src-ebom{background:#ecf5ff;color:#1869e1;}
  .src-mtoc{background:#f0f9eb;color:#67c23a;}
  .src-manual{background:#fdf6ec;color:#e6a23c;}
</style>
</head>
<body>

<template id="page-body">
<div class="page" style="padding:0;display:flex;flex-direction:column;overflow:hidden;">
  <div class="panel" style="flex:1;display:flex;flex-direction:column;min-height:0;border:none;border-radius:0;">
    <div class="search-area" id="searchArea">
      <div class="search-form">
        <div class="search-item"><label>项目代号：</label><input type="text" id="qProj" placeholder="请输入项目代号"></div>
        <div class="search-item"><label>车型：</label><input type="text" id="qModel" placeholder="请输入车型"></div>
        <div class="search-item"><label>品牌：</label>
          <select id="qBrand"><option value="">全部</option><option>传祺</option><option>埃安</option><option>昊铂</option></select></div>
        <div class="search-item"><label>项目状态：</label>
          <select id="qStatus"><option value="">全部</option><option>新车型</option><option>量产</option><option>在研</option></select></div>
        <div class="search-actions">
          <button class="btn btn-primary" onclick="doSearch()">查询</button>
          <button class="btn btn-default" onclick="resetSearch()">重置</button>
        </div>
      </div>
    </div>

    <div class="alert alert-info" style="margin:12px 16px 0;">
      <span class="ico">ⓘ</span>
      <div><b>本页定位：车型 / 项目的「项目级主数据 + 人员 / 品牌关系」</b>（车型项目、MTOC、PL 人员、品牌、项目状态），<b>不再是「车型 ↔ 零件」关系的唯一来源</b>。<br><b>零件级「车型 ↔ 零件」关系已独立到【车型·零件关系】页维护</b>——含数据源（量产车型 IBOM / 埃安 GBOM 直连、传祺 GBM 通过 BOM 接入、新车型通过 PMS 接入）与<b>人工补录（直接新增零件关系）</b>。本页下方零件清单（零件 Tab）为<b>只读预览 + 字段来源</b>——其<b>车型编码 / 车型分类 / 采购类型</b>即【车型·零件关系】列表的取数字段。</div>
    </div>

    <div class="table-toolbar">
      <button class="btn btn-primary" onclick="tip('新增车型项目')">新增</button>
      <button class="btn btn-default" onclick="doExport()">导出</button>
      <button class="btn btn-default" onclick="location.href='11_车型零件关系.html'">车型·零件关系维护</button>
      <div class="right"><span class="toolbar-note">共 <b id="totalText">0</b> 个项目</span></div>
    </div>

    <div class="table-wrap" style="flex:1;overflow:auto;min-height:0;" id="projList"></div>

    <div class="pagination-bar">
      <span class="muted">展开项目可查看该项目下的零件清单（零件 Tab，只读预览，供数据权限 Provider 取数与字段来源）；零件级关系的维护与人工补录见【车型·零件关系】页。</span>
    </div>
  </div>
</div>
</template>

<script src="_common/gpm-layout.js"></script>
<script>
GpmLayout.init({
  activePage: 'carModelProject',
  breadcrumb: ['首页', '业务模块', '车型项目管理'],
  tabs: [
    { key:'home', label:'首页', closable:false },
    { key:'carModelProject', label:'车型项目管理' }
  ],
  activeTab: 'carModelProject'
});

/* Mock：项目 + 零件（来源标记）；mclass＝车型分类、buyType＝采购类型，
   两者与车型名称 / 车型编码 / 车型状态一并为【车型·零件关系】列表的取数字段 */
var projects = [
  { code:'PRJ-AY2025', model:'AION Y', brand:'埃安', mclass:'SUV', pl:'张少伟', status:'量产', mtoc:'MTOC-AY-01',
    parts:[
      { no:'MTOC-A1001', name:'前门内饰板', buyType:'生产采购', fp:'内外饰功能包', eng:'刘德', buyer:'孙倩', src:'EBOM' },
      { no:'MTOC-A1002', name:'后门内饰板', buyType:'生产采购', fp:'内外饰功能包', eng:'刘德', buyer:'孙倩', src:'EBOM' },
      { no:'MTOC-A2001', name:'仪表板总成', buyType:'生产采购', fp:'座舱功能包', eng:'陈静', buyer:'孙倩', src:'MTOC' },
      { no:'MTOC-A3001', name:'座椅骨架', buyType:'生产采购', fp:'座椅功能包', eng:'冯华', buyer:'周敏', src:'MANUAL' }
    ]},
  { code:'PRJ-AS2026', model:'AION S Plus', brand:'埃安', mclass:'轿车', pl:'陈静', status:'新车型', mtoc:'MTOC-AS-02',
    parts:[
      { no:'MTOC-B1001', name:'前保险杠', buyType:'生产采购', fp:'外饰功能包', eng:'陈静', buyer:'孙倩', src:'EBOM' },
      { no:'MTOC-B2001', name:'中控显示屏', buyType:'非生产采购', fp:'智联功能包', eng:'吴刚', buyer:'孙倩', src:'MTOC' }
    ]},
  { code:'PRJ-M8-2024', model:'传祺M8', brand:'传祺', mclass:'MPV', pl:'王慧芬', status:'量产', mtoc:'MTOC-M8-01',
    parts:[
      { no:'MTOC-C1001', name:'侧滑门总成', buyType:'生产采购', fp:'车身功能包', eng:'冯华', buyer:'周敏', src:'EBOM' },
      { no:'MTOC-C2001', name:'第三排座椅', buyType:'生产采购', fp:'座椅功能包', eng:'冯华', buyer:'周敏', src:'EBOM' }
    ]},
  { code:'PRJ-HGT-2026', model:'昊铂GT', brand:'昊铂', mclass:'轿车', pl:'赵磊', status:'在研', mtoc:'MTOC-HGT-01',
    parts:[
      { no:'MTOC-D1001', name:'激光雷达支架', buyType:'生产采购', fp:'智联功能包', eng:'赵磊', buyer:'孙倩', src:'MANUAL' }
    ]}
];
var filtered = projects.slice();

function srcBadge(s){
  if(s==='EBOM') return '<span class="part-src src-ebom">EBOM卷入</span>';
  if(s==='MTOC') return '<span class="part-src src-mtoc">MTOC卷入</span>';
  return '<span class="part-src src-manual">人工补录</span>';
}
function render(){
  var box=document.getElementById('projList'); box.innerHTML='';
  filtered.forEach(function(p,idx){
    var card=document.createElement('div'); card.className='proj-card';
    var partsRows = p.parts.map(function(pt,i){
      return '<tr><td>'+(i+1)+'</td><td style="font-family:monospace;">'+pt.no+'</td><td class="text-left">'+pt.name+'</td><td>'+(pt.buyType||'—')+'</td><td>'+pt.fp+'</td><td>'+pt.eng+'</td><td>'+pt.buyer+'</td><td>'+srcBadge(pt.src)+'</td></tr>';
    }).join('');
    card.innerHTML =
      '<div class="proj-head" onclick="toggleProj(this)">'+
        '<span class="pname">'+p.model+'</span>'+
        '<span class="meta">车型编码：'+p.code+'</span>'+
        '<span class="meta">车型分类：'+p.mclass+'</span>'+
        '<span class="meta">品牌：'+p.brand+'</span>'+
        '<span class="meta">MTOC：'+p.mtoc+'</span>'+
        '<span class="meta">PL：'+p.pl+'</span>'+
        '<span class="tag tag-'+(p.status==='量产'?'green':(p.status==='新车型'?'blue':'orange'))+'">'+p.status+'</span>'+
        '<span class="meta">零件数：'+p.parts.length+'</span>'+
        '<span class="expand-ico">▾</span>'+
      '</div>'+
      '<div class="proj-body">'+
        '<table class="list-table" style="margin-top:12px;"><thead><tr>'+
          '<th style="width:46px;">序号</th><th style="min-width:130px;">零件编号</th><th style="min-width:150px;">零件名称</th><th style="width:110px;">采购类型</th><th style="min-width:120px;">功能包</th><th style="width:100px;">责任工程师</th><th style="width:100px;">采购员</th><th style="width:110px;">来源</th>'+
        '</tr></thead><tbody>'+partsRows+'</tbody></table>'+
      '</div>';
    box.appendChild(card);
  });
  document.getElementById('totalText').innerText=filtered.length;
}
function toggleProj(head){ head.closest('.proj-card').classList.toggle('open'); }

function doSearch(){
  var pj=qProj.value.trim(),m=qModel.value.trim(),b=qBrand.value,s=qStatus.value;
  filtered=projects.filter(function(p){
    if(pj && p.code.indexOf(pj)<0)return false;
    if(m && p.model.indexOf(m)<0)return false;
    if(b && p.brand!==b)return false;
    if(s && p.status!==s)return false;
    return true;
  });
  render();
}
function resetSearch(){qProj.value='';qModel.value='';qBrand.value='';qStatus.value='';filtered=projects.slice();render();}
function tip(m){alert(m);}
function doExport(){ alert('已导出车型项目及零件关系.xlsx（含车型↔零件映射，供数据权限取数核对）'); }

render();
</script>
</body>
</html>
