<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字段权限配置 - GPM系统</title>
<link rel="stylesheet" href="_common/gpm.css">
<style>
  .proto-note{background:#fffbe6;border:1px solid #ffe58f;color:#8c6d1f;border-radius:4px;padding:8px 12px;font-size:12px;margin:10px 12px 0;}
  .proto-note b{color:#ad6800;}
  .scope-tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;}
  .scope-tag.role{background:#eef4ff;color:#1869e1;}
  .scope-tag.person{background:#f4ecfd;color:#7d4fd6;}
  .op-link{color:#1869e1;cursor:pointer;margin-right:10px;font-size:13px;}
  .op-link.danger{color:#f56c6c;}
  .op-link:hover{text-decoration:underline;}
  .mask-money{color:#f56c6c;font-weight:bold;}
  /* 弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:900;}
  .modal-mask.show{display:block;}
  .modal-card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:780px;max-height:82vh;background:#fff;border-radius:6px;z-index:901;display:none;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.18);}
  .modal-card.show{display:flex;}
  .modal-head{padding:14px 18px;border-bottom:1px solid #ebeef5;font-size:15px;font-weight:bold;color:#303133;}
  .modal-body{padding:16px 18px;overflow:auto;}
  .modal-foot{padding:12px 18px;border-top:1px solid #ebeef5;text-align:right;}
  .form-row{display:flex;align-items:center;margin-bottom:12px;font-size:13px;color:#606266;}
  .form-row>label{width:96px;text-align:right;margin-right:10px;}
  .form-row .req{color:#f56c6c;margin-right:2px;}
  .form-row select{height:30px;min-width:260px;border:1px solid #dcdfe6;border-radius:4px;padding:0 8px;font-size:13px;}
  .radio-group{display:flex;gap:18px;align-items:center;}
  .radio-group label{cursor:pointer;}
  .field-box{border:1px solid #ebeef5;border-radius:4px;max-height:280px;overflow:auto;}
  .field-box table{width:100%;border-collapse:collapse;font-size:13px;}
  .field-box th{background:#f5f7fa;color:#909399;font-weight:normal;text-align:left;padding:8px 10px;border-bottom:1px solid #ebeef5;}
  .field-box td{padding:7px 10px;border-bottom:1px solid #f5f7fa;}
  .field-box select{height:28px;border:1px solid #dcdfe6;border-radius:4px;font-size:12px;}
  .tip{font-size:12px;color:#909399;margin-top:8px;}
</style>
</head>
<body>

<template id="page-body">
<div class="page" style="padding:0;display:flex;flex-direction:column;overflow:hidden;">

  <div class="proto-note">
    <b>线框图 v1（1019 待确认）</b>：①「菜单 / 配置方式 / 角色·人员 / 字段 / 可见性」全部进列表（B 端 CRUD 样式）；② 新增「操作」列（编辑 / 删除）；③ 人员配置**取消「跟随角色」**，只保留「可见 / 屏蔽」，人员独立配置。
  </div>

  <div class="panel" style="flex:1;display:flex;flex-direction:column;min-height:0;border:none;border-radius:0;">

    <!-- 查询区 -->
    <div class="search-area" id="searchArea">
      <div class="search-form">
        <div class="search-item"><label>菜单名称：</label>
          <select id="qMenu">
            <option value="">全部</option>
            <option>成本分析-功能包及采购成本达成</option>
            <option>成本分析-部门达成情况</option>
            <option>成本分析-采购成本达成</option>
            <option>成本分析-变化履历</option>
            <option>价格目录</option>
          </select></div>
        <div class="search-item"><label>配置方式：</label>
          <select id="qMode">
            <option value="">全部</option>
            <option value="role">按角色绑定</option>
            <option value="person">按人员例外</option>
          </select></div>
        <div class="search-item"><label>角色/人员：</label>
          <input id="qScope" type="text" placeholder="输入角色名 / 姓名 / 工号" style="width:190px;height:30px;border:1px solid #dcdfe6;border-radius:4px;padding:0 8px;font-size:13px;"></div>
        <div class="search-item"><label>字段：</label>
          <input id="qField" type="text" placeholder="字段编码 / 中文名" style="width:170px;height:30px;border:1px solid #dcdfe6;border-radius:4px;padding:0 8px;font-size:13px;"></div>
        <div class="search-actions">
          <button class="btn btn-primary" onclick="doSearch()">查询</button>
          <button class="btn btn-default" onclick="doReset()">重置</button>
        </div>
      </div>
    </div>

    <!-- 工具栏 -->
    <div class="table-toolbar">
      <button class="btn btn-primary" onclick="openEdit()">+ 新增配置</button>
      <button class="btn btn-default" onclick="doImport()">导入</button>
      <button class="btn btn-default" onclick="doExport()">导出</button>
      <div class="right"><span class="toolbar-note">共 <b id="totalText">0</b> 条配置</span></div>
    </div>

    <!-- 列表 -->
    <div class="table-wrap" style="flex:1;overflow:auto;min-height:0;">
      <table class="list-table">
        <thead><tr>
          <th style="width:46px;">序号</th>
          <th style="min-width:210px;">菜单名称</th>
          <th style="width:110px;">配置方式</th>
          <th style="min-width:150px;">角色 / 人员</th>
          <th style="min-width:120px;">字段编码</th>
          <th style="min-width:120px;">字段中文名</th>
          <th style="width:80px;">可见性</th>
          <th style="width:100px;">当前生效结果</th>
          <th style="width:90px;">更新人</th>
          <th style="width:140px;">更新时间</th>
          <th style="width:110px;">操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="pagination-bar">
      <span class="muted">按系统原有分页规则渲染（示例）</span>
    </div>
  </div>
</div>
</template>

<!-- 新增 / 编辑弹窗 -->
<div class="modal-mask" id="mask" onclick="closeEdit()"></div>
<div class="modal-card" id="modal">
  <div class="modal-head" id="modalTitle">新增字段权限配置</div>
  <div class="modal-body">
    <div class="form-row">
      <label><span class="req">*</span>菜单名称</label>
      <select id="fMenu" onchange="renderFieldBox()">
        <option value="">请选择菜单</option>
        <option>成本分析-功能包及采购成本达成</option>
        <option>成本分析-部门达成情况</option>
        <option>成本分析-采购成本达成</option>
        <option>成本分析-变化履历</option>
        <option>价格目录</option>
      </select>
    </div>
    <div class="form-row">
      <label><span class="req">*</span>配置方式</label>
      <div class="radio-group">
        <label><input type="radio" name="fMode" value="role" checked onchange="onModeChange()"> 按角色绑定</label>
        <label><input type="radio" name="fMode" value="person" onchange="onModeChange()"> 按人员例外</label>
      </div>
    </div>
    <div class="form-row">
      <label><span class="req">*</span><span id="scopeLabel">角色</span></label>
      <select id="fScope"></select>
    </div>
    <div class="form-row" style="align-items:flex-start;">
      <label style="padding-top:6px;">字段与可见性</label>
      <div style="flex:1;">
        <div class="field-box">
          <table>
            <thead><tr>
              <th style="width:46px;">选择</th>
              <th style="width:150px;">字段编码</th>
              <th>字段中文名</th>
              <th style="width:110px;">可见性</th>
            </tr></thead>
            <tbody id="fieldBoxBody">
              <tr><td colspan="4" style="color:#909399;padding:20px;text-align:center;">请先选择菜单名称</td></tr>
            </tbody>
          </table>
        </div>
        <div class="tip">勾选需要配置的字段；未勾选的字段不产生配置记录（按默认「全可见」处理）。</div>
      </div>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-default" onclick="closeEdit()">取消</button>
    <button class="btn btn-primary" onclick="saveRecord()" style="margin-left:8px;">保存</button>
  </div>
</div>

<script src="_common/gpm-layout.js"></script>
<script>
GpmLayout.init({
  activePage: 'fieldPermission',
  breadcrumb: ['首页', '用户权限', '字段权限配置'],
  tabs: [
    { key:'home', label:'首页', closable:false },
    { key:'dataAuthConfig', label:'数据权限配置', page:'03_数据权限配置.html' },
    { key:'fieldPermission', label:'字段权限配置' }
  ],
  activeTab: 'fieldPermission'
});

/* ---------- 敏感字段库（来自【敏感字段元数据维护】，入库即敏感） ---------- */
var PAGE_FIELDS = {
  '成本分析-功能包及采购成本达成': [
    { code:'unitPrice',   name:'单价(成本价)' },
    { code:'materialFee', name:'材料费' },
    { code:'processFee',  name:'加工费' },
    { code:'profitRate',  name:'利润率' },
    { code:'targetCost',  name:'目标成本' },
    { code:'actualCost',  name:'实际成本' }
  ],
  '成本分析-部门达成情况': [
    { code:'unitPrice',   name:'单价(成本价)' },
    { code:'materialFee', name:'材料费' },
    { code:'actualCost',  name:'实际成本' }
  ],
  '成本分析-采购成本达成': [
    { code:'unitPrice',  name:'单价(成本价)' },
    { code:'profitRate', name:'利润率' },
    { code:'actualCost', name:'实际成本' }
  ],
  '成本分析-变化履历': [
    { code:'lastPrice',  name:'上次价格' },
    { code:'curPrice',   name:'本次价格' },
    { code:'diffAmount', name:'价差金额' }
  ],
  '价格目录': [
    { code:'supplierName', name:'供应商名称' },
    { code:'buyer',        name:'采购员' },
    { code:'dept',         name:'科室' }
  ]
};

var ROLES = ['领域经理','部门经理','使用工程师','成本管理员'];
var PERSONS = [
  { id:'liude',    text:'刘德（10086 / 使用工程师）' },
  { id:'chenjing', text:'陈静（10092 / 使用工程师）' },
  { id:'sunqian',  text:'孙倩（20113 / 采购员）' }
];

/* ---------- mock 配置记录（列表即配置主体，字段粒度） ---------- */
var CONFIGS = [
  { id:1, menu:'成本分析-功能包及采购成本达成', mode:'role',   scope:'使用工程师', code:'unitPrice',  name:'单价(成本价)', visible:false, by:'系统', time:'2026-10-13 10:20' },
  { id:2, menu:'成本分析-功能包及采购成本达成', mode:'role',   scope:'使用工程师', code:'profitRate', name:'利润率',      visible:false, by:'系统', time:'2026-10-13 10:20' },
  { id:3, menu:'成本分析-功能包及采购成本达成', mode:'person', scope:'刘德',       code:'unitPrice',  name:'单价(成本价)', visible:true,  by:'孙倩', time:'2026-10-13 14:05' },
  { id:4, menu:'成本分析-功能包及采购成本达成', mode:'person', scope:'陈静',       code:'profitRate', name:'利润率',      visible:false, by:'孙倩', time:'2026-10-13 14:08' },
  { id:5, menu:'成本分析-部门达成情况',        mode:'role',   scope:'部门经理',   code:'actualCost', name:'实际成本',    visible:false, by:'系统', time:'2026-10-12 09:30' },
  { id:6, menu:'成本分析-采购成本达成',        mode:'role',   scope:'成本管理员', code:'unitPrice',  name:'单价(成本价)', visible:true,  by:'系统', time:'2026-10-12 09:30' },
  { id:7, menu:'价格目录',                     mode:'role',   scope:'使用工程师', code:'supplierName', name:'供应商名称', visible:false, by:'系统', time:'2026-10-11 16:40' },
  { id:8, menu:'价格目录',                     mode:'person', scope:'孙倩',       code:'supplierName', name:'供应商名称', visible:true,  by:'孙倩', time:'2026-10-11 17:10' }
];
var SEQ = 9;
var editingId = null;

function modeText(m){ return m==='role' ? '按角色绑定' : '按人员例外'; }
function visibleTag(v){ return v ? '<span class="tag tag-green">可见</span>' : '<span class="tag tag-red">屏蔽</span>'; }
function effectText(v){ return v ? '<span class="tag tag-green">可见</span>' : '<span class="mask-money">* 已屏蔽</span>'; }

/* ---------- 查询 / 渲染 ---------- */
function currentList(){
  var m=document.getElementById('qMenu').value;
  var md=document.getElementById('qMode').value;
  var sc=document.getElementById('qScope').value.trim();
  var fd=document.getElementById('qField').value.trim().toLowerCase();
  return CONFIGS.filter(function(r){
    if(m && r.menu!==m) return false;
    if(md && r.mode!==md) return false;
    if(sc && r.scope.indexOf(sc)<0) return false;
    if(fd && (r.code.toLowerCase().indexOf(fd)<0 && r.name.indexOf(fd)<0)) return false;
    return true;
  });
}
function doSearch(){ render(); }
function doReset(){
  document.getElementById('qMenu').value='';
  document.getElementById('qMode').value='';
  document.getElementById('qScope').value='';
  document.getElementById('qField').value='';
  render();
}
function render(){
  var tb=document.getElementById('tbody'); tb.innerHTML='';
  var list=currentList();
  document.getElementById('totalText').innerText=list.length;
  if(!list.length){
    tb.innerHTML='<tr><td colspan="11" style="color:#909399;padding:32px;text-align:center;">暂无配置记录，点击「+ 新增配置」开始</td></tr>';
    return;
  }
  list.forEach(function(r,i){
    var tr=document.createElement('tr');
    tr.innerHTML=
      '<td>'+(i+1)+'</td>'+
      '<td class="text-left">'+r.menu+'</td>'+
      '<td><span class="scope-tag '+(r.mode==='role'?'role':'person')+'">'+modeText(r.mode)+'</span></td>'+
      '<td class="text-left">'+r.scope+'</td>'+
      '<td class="text-left" style="font-family:Consolas,Monaco,monospace;font-size:12px;">'+r.code+'</td>'+
      '<td class="text-left">'+r.name+'</td>'+
      '<td>'+visibleTag(r.visible)+'</td>'+
      '<td>'+effectText(r.visible)+'</td>'+
      '<td>'+r.by+'</td>'+
      '<td>'+r.time+'</td>'+
      '<td><span class="op-link" onclick="openEdit('+r.id+')">编辑</span><span class="op-link danger" onclick="delRecord('+r.id+')">删除</span></td>';
    tb.appendChild(tr);
  });
}

/* ---------- 新增 / 编辑 ---------- */
function openEdit(id){
  editingId = (typeof id==='number') ? id : null;
  document.getElementById('modalTitle').innerText = editingId ? '编辑字段权限配置' : '新增字段权限配置';
  var mSel=document.getElementById('fMenu'), sSel=document.getElementById('fScope');
  sSel.innerHTML='';

  if(editingId){
    var r=CONFIGS.filter(function(x){return x.id===editingId;})[0];
    if(r){
      mSel.value=r.menu;
      document.querySelectorAll('input[name="fMode"]').forEach(function(el){ el.checked = (el.value===r.mode); });
      onModeChange(r.scope);
      renderFieldBox(r.code, r.visible);
      openModal(); return;
    }
  }
  mSel.value='';
  document.querySelector('input[name="fMode"][value="role"]').checked=true;
  onModeChange();
  renderFieldBox();
  openModal();
}
function onModeChange(preset){
  var m=document.querySelector('input[name="fMode"]:checked').value;
  var sSel=document.getElementById('fScope');
  document.getElementById('scopeLabel').innerText = m==='role' ? '角色' : '人员';
  sSel.innerHTML='';
  if(m==='role'){
    ROLES.forEach(function(x){ sSel.innerHTML+='<option>'+x+'</option>'; });
  }else{
    PERSONS.forEach(function(p){ sSel.innerHTML+='<option value="'+p.id+'">'+p.text+'</option>'; });
  }
  if(preset){
    for(var i=0;i<sSel.options.length;i++){
      if(sSel.options[i].text.indexOf(preset)>=0 || sSel.options[i].value===preset){ sSel.selectedIndex=i; break; }
    }
  }
}
function renderFieldBox(code, visible){
  var menu=document.getElementById('fMenu').value;
  var tb=document.getElementById('fieldBoxBody');
  var list=PAGE_FIELDS[menu]||[];
  if(!list.length){
    tb.innerHTML='<tr><td colspan="4" style="color:#909399;padding:20px;text-align:center;">请先选择菜单名称</td></tr>';
    return;
  }
  tb.innerHTML='';
  list.forEach(function(f){
    var checked = (code===f.code);
    if(code===undefined && editingId===null) checked=false;
    if(code===undefined && editingId!==null) checked=false;
    var tr=document.createElement('tr');
    tr.innerHTML=
      '<td><input type="checkbox" class="fchk" data-code="'+f.code+'" data-name="'+f.name+'" '+(checked?'checked':'')+'></td>'+
      '<td style="font-family:Consolas,Monaco,monospace;font-size:12px;">'+f.code+'</td>'+
      '<td>'+f.name+'</td>'+
      '<td><select class="fvis"><option value="1">可见</option><option value="0">屏蔽</option></select></td>';
    tb.appendChild(tr);
    if(checked){
      tr.querySelector('.fvis').value = visible ? '1' : '0';
    }
  });
}
function saveRecord(){
  var menu=document.getElementById('fMenu').value;
  if(!menu){ alert('请选择菜单名称'); return; }
  var m=document.querySelector('input[name="fMode"]:checked').value;
  var scopeSel=document.getElementById('fScope');
  var scope = (m==='role') ? scopeSel.value : (PERSONS.filter(function(p){return p.id===scopeSel.value;})[0]||{}).text;
  scope = scope || scopeSel.value;
  if(m==='person'){ // 人员只取姓名部分，展示更干净
    var hit=PERSONS.filter(function(p){return p.id===scopeSel.value;})[0];
    if(hit) scope=hit.text.split('（')[0];
  }

  var picked=[];
  document.querySelectorAll('#fieldBoxBody tr').forEach(function(tr){
    var ck=tr.querySelector('.fchk'); if(!ck) return;
    if(ck.checked) picked.push({ code:ck.dataset.code, name:ck.dataset.name, visible:tr.querySelector('.fvis').value==='1' });
  });
  if(!picked.length){ alert('请至少勾选一个字段'); return; }

  var now = new Date();
  var t = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+
          String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

  if(editingId){
    CONFIGS = CONFIGS.filter(function(x){ return x.id!==editingId; });
  }
  // 同一「菜单 × 方式 × 作用域 × 字段」视为同一条：先清理旧记录
  CONFIGS = CONFIGS.filter(function(x){
    return !(x.menu===menu && x.mode===m && x.scope===scope && picked.some(function(p){return p.code===x.code;}));
  });
  picked.forEach(function(p){
    CONFIGS.push({ id:SEQ++, menu:menu, mode:m, scope:scope, code:p.code, name:p.name, visible:p.visible, by:'当前用户', time:t });
  });
  closeEdit();
  render();
  alert('保存成功：'+(editingId?'已更新':'已新增')+' '+picked.length+' 条字段权限配置（保存后即时生效）');
}

function openModal(){ document.getElementById('mask').classList.add('show'); document.getElementById('modal').classList.add('show'); }
function closeEdit(){ editingId=null; document.getElementById('mask').classList.remove('show'); document.getElementById('modal').classList.remove('show'); }

/* ---------- 删除 ---------- */
function delRecord(id){
  var r=CONFIGS.filter(function(x){return x.id===id;})[0];
  if(!r) return;
  if(confirm('确认删除该条字段权限配置吗？\n\n菜单：'+r.menu+'\n作用域：'+modeText(r.mode)+' - '+r.scope+'\n字段：'+r.name+'（'+r.code+'）\n\n删除后该字段按默认「全可见」处理。')){
    CONFIGS = CONFIGS.filter(function(x){return x.id!==id;});
    render();
  }
}

function doImport(){ alert('导入字段权限配置（模板列：菜单名称* / 配置方式* / 角色或人员* / 字段编码* / 可见性*；按「菜单 × 方式 × 作用域 × 字段」upsert，整单校验失败全回滚，单次上限 5000 行）'); }
function doExport(){ alert('已导出字段权限配置-YYYYMMDD.xlsx（按当前查询条件导出全部命中数据，不含「操作」列）'); }

render();
</script>
</body>
</html>
