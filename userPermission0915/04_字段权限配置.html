<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字段权限配置 - GPM系统</title>
<link rel="stylesheet" href="_common/gpm.css">
<style>
  .proto-note{background:#fffbe6;border:1px solid #ffe58f;color:#8c6d1f;border-radius:4px;padding:8px 12px;font-size:12px;margin:10px 12px 0;}
  .proto-note b{color:#ad6800;}
  .scope-tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;}
  .scope-tag.role{background:#eef4ff;color:#1869e1;}
  .scope-tag.person{background:#f4ecfd;color:#7d4fd6;}
  .op-link{color:#1869e1;cursor:pointer;margin-right:10px;font-size:13px;}
  .op-link.danger{color:#f56c6c;}
  .op-link:hover{text-decoration:underline;}
  .mask-money{color:#f56c6c;font-weight:bold;}
  .edit-row td{background:#f7fbff;padding:6px 8px;}
  .edit-row select,.edit-row input{height:28px;border:1px solid #dcdfe6;border-radius:4px;font-size:12px;padding:0 6px;max-width:100%;}
  .edit-row .mini-btn{height:26px;padding:0 10px;font-size:12px;border-radius:4px;border:1px solid #dcdfe6;background:#fff;cursor:pointer;margin-right:6px;}
  .edit-row .mini-btn.primary{background:#1869e1;border-color:#1869e1;color:#fff;}
  .row-check{width:14px;height:14px;cursor:pointer;}
</style>
</head>
<body>

<template id="page-body">
<div class="page" style="padding:0;display:flex;flex-direction:column;overflow:hidden;">

  <div class="proto-note">
    <b>线框图 v2（1019）</b>：① 菜单 / 配置方式 / 角色·人员 / 字段 / 可见性 全部进列表（B 端 CRUD）；② 操作列：编辑 / 删除 + 勾选批量删除；③ 人员配置**独立生效、不与角色合并**（取消「跟随角色」与「生效结果」列）；④ 新增/编辑为**行内单条**编辑。
  </div>

  <div class="panel" style="flex:1;display:flex;flex-direction:column;min-height:0;border:none;border-radius:0;">

    <!-- 查询区 -->
    <div class="search-area" id="searchArea">
      <div class="search-form">
        <div class="search-item"><label>菜单名称：</label>
          <select id="qMenu">
            <option value="">全部</option>
            <option>成本分析-功能包及采购成本达成</option>
            <option>成本分析-部门达成情况</option>
            <option>成本分析-采购成本达成</option>
            <option>成本分析-变化履历</option>
            <option>价格目录</option>
          </select></div>
        <div class="search-item"><label>配置方式：</label>
          <select id="qMode">
            <option value="">全部</option>
            <option value="role">按角色绑定</option>
            <option value="person">按人员例外</option>
          </select></div>
        <div class="search-item"><label>角色/人员：</label>
          <input id="qScope" type="text" placeholder="角色名 / 姓名 / 工号" style="width:180px;height:30px;border:1px solid #dcdfe6;border-radius:4px;padding:0 8px;font-size:13px;"></div>
        <div class="search-item"><label>字段：</label>
          <input id="qField" type="text" placeholder="字段编码 / 中文名" style="width:160px;height:30px;border:1px solid #dcdfe6;border-radius:4px;padding:0 8px;font-size:13px;"></div>
        <div class="search-actions">
          <button class="btn btn-primary" onclick="doSearch()">查询</button>
          <button class="btn btn-default" onclick="doReset()">重置</button>
        </div>
      </div>
    </div>

    <!-- 工具栏 -->
    <div class="table-toolbar">
      <button class="btn btn-primary" onclick="addRow()">+ 新增配置</button>
      <button class="btn btn-default" onclick="batchDelete()">批量删除</button>
      <button class="btn btn-default" onclick="doImport()">导入</button>
      <button class="btn btn-default" onclick="doExport()">导出</button>
      <div class="right"><span class="toolbar-note">共 <b id="totalText">0</b> 条配置　已选 <b id="selText">0</b> 条</span></div>
    </div>

    <!-- 列表 -->
    <div class="table-wrap" style="flex:1;overflow:auto;min-height:0;">
      <table class="list-table">
        <thead><tr>
          <th style="width:40px;"><input type="checkbox" class="row-check" id="checkAll" onclick="toggleAll(this)"></th>
          <th style="width:46px;">序号</th>
          <th style="min-width:200px;">菜单名称</th>
          <th style="width:110px;">配置方式</th>
          <th style="min-width:140px;">角色 / 人员</th>
          <th style="min-width:110px;">字段编码</th>
          <th style="min-width:110px;">字段中文名</th>
          <th style="width:80px;">可见性</th>
          <th style="width:80px;">更新人</th>
          <th style="width:135px;">更新时间</th>
          <th style="width:110px;">操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="pagination-bar">
      <span class="muted">按系统原有分页规则渲染（示例）</span>
    </div>
  </div>
</div>
</template>

<script src="_common/gpm-layout.js"></script>
<script>
GpmLayout.init({
  activePage: 'fieldPermission',
  breadcrumb: ['首页', '用户权限', '字段权限配置'],
  tabs: [
    { key:'home', label:'首页', closable:false },
    { key:'dataAuthConfig', label:'数据权限配置', page:'03_数据权限配置.html' },
    { key:'fieldPermission', label:'字段权限配置' }
  ],
  activeTab: 'fieldPermission'
});

/* ---------- 敏感字段库（来自【敏感字段元数据维护】） ---------- */
var PAGE_FIELDS = {
  '成本分析-功能包及采购成本达成': [
    { code:'unitPrice',   name:'单价(成本价)' },
    { code:'materialFee', name:'材料费' },
    { code:'processFee',  name:'加工费' },
    { code:'profitRate',  name:'利润率' },
    { code:'targetCost',  name:'目标成本' },
    { code:'actualCost',  name:'实际成本' }
  ],
  '成本分析-部门达成情况': [
    { code:'unitPrice',   name:'单价(成本价)' },
    { code:'materialFee', name:'材料费' },
    { code:'actualCost',  name:'实际成本' }
  ],
  '成本分析-采购成本达成': [
    { code:'unitPrice',  name:'单价(成本价)' },
    { code:'profitRate', name:'利润率' },
    { code:'actualCost', name:'实际成本' }
  ],
  '成本分析-变化履历': [
    { code:'lastPrice',  name:'上次价格' },
    { code:'curPrice',   name:'本次价格' },
    { code:'diffAmount', name:'价差金额' }
  ],
  '价格目录': [
    { code:'supplierName', name:'供应商名称' },
    { code:'buyer',        name:'采购员' },
    { code:'dept',         name:'科室' }
  ]
};
var MENUS = Object.keys(PAGE_FIELDS);
var ROLES = ['领域经理','部门经理','使用工程师','成本管理员'];
var PERSONS = [
  { id:'liude',    text:'刘德（10086）' },
  { id:'chenjing', text:'陈静（10092）' },
  { id:'sunqian',  text:'孙倩（20113）' }
];

/* ---------- 配置记录（字段粒度，列表即配置主体） ---------- */
var CONFIGS = [
  { id:1, menu:'成本分析-功能包及采购成本达成', mode:'role',   scope:'使用工程师', code:'unitPrice',    name:'单价(成本价)', visible:false, by:'系统', time:'2026-10-13 10:20' },
  { id:2, menu:'成本分析-功能包及采购成本达成', mode:'role',   scope:'使用工程师', code:'profitRate',   name:'利润率',       visible:false, by:'系统', time:'2026-10-13 10:20' },
  { id:3, menu:'成本分析-功能包及采购成本达成', mode:'person', scope:'刘德',       code:'unitPrice',    name:'单价(成本价)', visible:true,  by:'孙倩', time:'2026-10-13 14:05' },
  { id:4, menu:'成本分析-功能包及采购成本达成', mode:'person', scope:'陈静',       code:'profitRate',   name:'利润率',       visible:false, by:'孙倩', time:'2026-10-13 14:08' },
  { id:5, menu:'成本分析-部门达成情况',        mode:'role',   scope:'部门经理',   code:'actualCost',   name:'实际成本',     visible:false, by:'系统', time:'2026-10-12 09:30' },
  { id:6, menu:'成本分析-采购成本达成',        mode:'role',   scope:'成本管理员', code:'unitPrice',    name:'单价(成本价)', visible:true,  by:'系统', time:'2026-10-12 09:30' },
  { id:7, menu:'价格目录',                     mode:'role',   scope:'使用工程师', code:'supplierName', name:'供应商名称',   visible:false, by:'系统', time:'2026-10-11 16:40' },
  { id:8, menu:'价格目录',                     mode:'person', scope:'孙倩',       code:'supplierName', name:'供应商名称',   visible:true,  by:'孙倩', time:'2026-10-11 17:10' }
];
var SEQ = 9;
var selected = {};          // id -> true
var editing = null;         // { id: number|null, draft: {...} }

function modeText(m){ return m==='role' ? '按角色绑定' : '按人员例外'; }
function visibleTag(v){ return v ? '<span class="tag tag-green">可见</span>' : '<span class="tag tag-red">屏蔽</span>'; }
function findCfg(id){ return CONFIGS.filter(function(x){return x.id===id;})[0]; }

/* ---------- 查询 ---------- */
function currentList(){
  var m=document.getElementById('qMenu').value;
  var md=document.getElementById('qMode').value;
  var sc=document.getElementById('qScope').value.trim();
  var fd=document.getElementById('qField').value.trim().toLowerCase();
  return CONFIGS.filter(function(r){
    if(m && r.menu!==m) return false;
    if(md && r.mode!==md) return false;
    if(sc && r.scope.indexOf(sc)<0) return false;
    if(fd && (r.code.toLowerCase().indexOf(fd)<0 && r.name.indexOf(fd)<0)) return false;
    return true;
  });
}
function doSearch(){ render(); }
function doReset(){
  document.getElementById('qMenu').value='';
  document.getElementById('qMode').value='';
  document.getElementById('qScope').value='';
  document.getElementById('qField').value='';
  render();
}

/* ---------- 行内新增 / 编辑 ---------- */
function addRow(){
  editing = { id:null, draft:{ menu:'', mode:'role', scope:'', code:'', visible:false } };
  render();
  window.scrollTo(0,0);
}
function editRow(id){
  var r=findCfg(id); if(!r) return;
  editing = { id:id, draft:{ menu:r.menu, mode:r.mode, scope:r.scope, code:r.code, visible:r.visible } };
  render();
}
function cancelEdit(){ editing=null; render(); }
function onDraftMenu(v){
  editing.draft.menu=v;
  var fs=PAGE_FIELDS[v]||[];
  editing.draft.code = fs.length ? fs[0].code : '';
  render();
}
function onDraftMode(v){
  editing.draft.mode=v;
  editing.draft.scope = (v==='role') ? ROLES[0] : PERSONS[0].text;
  render();
}
function onDraftField(v){
  var fs=PAGE_FIELDS[editing.draft.menu]||[];
  var f=fs.filter(function(x){return x.code===v;})[0];
  editing.draft.code=v;
  if(f) editing.draft.name=f.name;
  render();
}
function saveDraft(){
  var d=editing.draft;
  if(!d.menu){ alert('请选择菜单名称'); return; }
  if(!d.scope){ alert('请选择角色 / 人员'); return; }
  if(!d.code){ alert('请选择字段'); return; }
  var fs=PAGE_FIELDS[d.menu]||[];
  var f=fs.filter(function(x){return x.code===d.code;})[0];
  var now=new Date();
  var t=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+
        String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  var scope = d.mode==='person' ? d.scope.split('（')[0] : d.scope;
  // 同「菜单 × 方式 × 作用域 × 字段」唯一：先删旧（含自身）
  CONFIGS = CONFIGS.filter(function(x){
    return !(x.menu===d.menu && x.mode===d.mode && x.scope===scope && x.code===d.code) && x.id!==editing.id;
  });
  CONFIGS.push({ id:editing.id||SEQ++, menu:d.menu, mode:d.mode, scope:scope, code:d.code,
                 name:(f?f.name:d.code), visible:!!d.visible, by:'当前用户', time:t });
  var wasEdit = !!editing.id;
  editing=null; render();
  alert('保存成功：'+(wasEdit?'已更新':'已新增')+' 1 条字段权限配置（保存后即时生效）');
}

/* ---------- 行内编辑行 HTML ---------- */
function editRowHtml(){
  var d=editing.draft;
  var menuOpts='<option value="">请选择菜单</option>'+MENUS.map(function(x){
    return '<option '+(x===d.menu?'selected':'')+'>'+x+'</option>';}).join('');
  var modeOpts='<option value="role" '+(d.mode==='role'?'selected':'')+'>按角色绑定</option>'+
               '<option value="person" '+(d.mode==='person'?'selected':'')+'>按人员例外</option>';
  var fs=PAGE_FIELDS[d.menu]||[];
  var scopeOpts='';
  if(d.mode==='role'){
    scopeOpts=ROLES.map(function(x){return '<option '+(x===d.scope?'selected':'')+'>'+x+'</option>';}).join('');
  }else{
    scopeOpts=PERSONS.map(function(p){
      var txt=p.text, sel=(d.scope&& (d.scope.indexOf(p.text.split('（')[0])>=0 || d.scope===p.text))?'selected':'';
      return '<option value="'+txt+'" '+sel+'>'+txt+'</option>';}).join('');
  }
  var fieldOpts=fs.length? fs.map(function(f){
    return '<option value="'+f.code+'" '+(f.code===d.code?'selected':'')+'>'+f.code+'</option>';}).join('')
    : '<option value="">（该菜单未维护字段）</option>';
  var visOpts='<option value="1" '+(d.visible?'selected':'')+'>可见</option>'+
              '<option value="0" '+(!d.visible?'selected':'')+'>屏蔽</option>';
  return '<tr class="edit-row">'+
    '<td></td>'+
    '<td class="muted">—</td>'+
    '<td><select onchange="onDraftMenu(this.value)" style="min-width:190px;">'+menuOpts+'</select></td>'+
    '<td><select onchange="onDraftMode(this.value)">'+modeOpts+'</select></td>'+
    '<td><select onchange="editing.draft.scope=this.value" style="min-width:130px;">'+scopeOpts+'</select></td>'+
    '<td><select onchange="onDraftField(this.value)" style="min-width:110px;">'+fieldOpts+'</select></td>'+
    '<td class="muted">（自动带出）</td>'+
    '<td><select onchange="editing.draft.visible=(this.value===\'1\')">'+visOpts+'</select></td>'+
    '<td class="muted">当前用户</td>'+
    '<td class="muted">保存时写入</td>'+
    '<td><button class="mini-btn primary" onclick="saveDraft()">保存</button>'+
        '<button class="mini-btn" onclick="cancelEdit()">取消</button></td>'+
    '</tr>';
}

/* ---------- 渲染 ---------- */
function toggleAll(ck){
  var list=currentList();
  selected={};
  if(ck.checked) list.forEach(function(r){ selected[r.id]=true; });
  render();
}
function toggleOne(id,ck){
  if(ck.checked) selected[id]=true; else delete selected[id];
  document.getElementById('selText').innerText=Object.keys(selected).length;
}
function render(){
  var tb=document.getElementById('tbody'); tb.innerHTML='';
  var list=currentList();
  document.getElementById('totalText').innerText=list.length;
  document.getElementById('selText').innerText=Object.keys(selected).length;

  if(editing && editing.id===null){
    tb.insertAdjacentHTML('beforeend', editRowHtml());
  }
  if(!list.length && !(editing && editing.id===null)){
    tb.innerHTML='<tr><td colspan="11" style="color:#909399;padding:32px;text-align:center;">暂无配置记录，点击「+ 新增配置」开始</td></tr>';
    return;
  }
  list.forEach(function(r,i){
    if(editing && editing.id===r.id){
      tb.insertAdjacentHTML('beforeend', editRowHtml());
      return;
    }
    var tr=document.createElement('tr');
    tr.innerHTML=
      '<td><input type="checkbox" class="row-check" '+(selected[r.id]?'checked':'')+' onclick="toggleOne('+r.id+',this)"></td>'+
      '<td>'+(i+1)+'</td>'+
      '<td class="text-left">'+r.menu+'</td>'+
      '<td><span class="scope-tag '+(r.mode==='role'?'role':'person')+'">'+modeText(r.mode)+'</span></td>'+
      '<td class="text-left">'+r.scope+'</td>'+
      '<td class="text-left" style="font-family:Consolas,Monaco,monospace;font-size:12px;">'+r.code+'</td>'+
      '<td class="text-left">'+r.name+'</td>'+
      '<td>'+visibleTag(r.visible)+'</td>'+
      '<td>'+r.by+'</td>'+
      '<td>'+r.time+'</td>'+
      '<td><span class="op-link" onclick="editRow('+r.id+')">编辑</span><span class="op-link danger" onclick="delRecord('+r.id+')">删除</span></td>';
    tb.appendChild(tr);
  });
}

/* ---------- 删除 ---------- */
function delRecord(id){
  var r=findCfg(id); if(!r) return;
  if(confirm('确认删除该条字段权限配置吗？\n\n菜单：'+r.menu+'\n作用域：'+modeText(r.mode)+' - '+r.scope+'\n字段：'+r.name+'（'+r.code+'）\n\n删除后该字段按默认「全可见」处理。')){
    CONFIGS=CONFIGS.filter(function(x){return x.id!==id;});
    delete selected[id];
    render();
  }
}
function batchDelete(){
  var ids=Object.keys(selected).map(Number);
  if(!ids.length){ alert('请先勾选要删除的配置'); return; }
  if(!confirm('确认删除已勾选的 '+ids.length+' 条字段权限配置吗？\n\n删除后对应字段按默认「全可见」处理。')) return;
  CONFIGS=CONFIGS.filter(function(x){ return ids.indexOf(x.id)<0; });
  selected={};
  document.getElementById('checkAll').checked=false;
  render();
}

function doImport(){ alert('导入字段权限配置（模板列：菜单名称* / 配置方式* / 角色或人员* / 字段编码* / 可见性*；按「菜单 × 方式 × 作用域 × 字段」upsert，整单校验失败全回滚，单次上限 5000 行）'); }
function doExport(){ alert('已导出字段权限配置-YYYYMMDD.xlsx（按当前查询条件导出全部命中数据，不含「操作」列）'); }

render();
</script>
</body>
</html>
