  .tab-pane.active{display:block;}

function descRow(descArr){
  var tr = document.createElement('tr');
  tr.className = 'desc-row';
  var td0 = document.createElement('td');
  td0.className = 'desc-key';
  td0.colSpan = 1;
  td0.textContent = '字段说明';
  tr.appendChild(td0);
  for (var i = 0; i < descArr.length - 1; i++) {
    var td = document.createElement('td');
    td.textContent = descArr[i + 1] || '';
    tr.appendChild(td);
  }
  return tr;
}

function dataRow(arr, numIdx){
  var tr = document.createElement('tr');
  arr.forEach(function(v, i){
    var td = document.createElement('td');
    td.textContent = v;
    if (numIdx.indexOf(i) >= 0) td.className = 'num';
    if (i === 18) td.className = (td.className + ' hl').trim();   // 实时成本（含返利）高亮
    tr.appendChild(td);
  });
  return tr;
}

  Object.keys(TAB_PANE).forEach(function(k){
    var pane = document.getElementById(TAB_PANE[k]);
    if (pane) pane.classList.toggle('active', k === key);
  });
  document.querySelectorAll('#rptTabs .tab-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab') === key);
  });
  // 筛选区不重建，项目代号 / 数据来源 / 发布日期已选值天然保留
  updateNote();
}

/* ================= 筛选与版本 ================= */
function onSourceChange(){
  var isRealtime = document.getElementById('qSource').value === 'realtime';
  ['qDateFrom','qDateTo'].forEach(function(id){
    var el = document.getElementById(id);
    el.disabled = isRealtime;
    el.style.background = isRealtime ? '#f5f7fa' : '#fff';
    el.style.color = isRealtime ? '#c0c4cc' : '#606266';
  });
  document.getElementById('dateHint').innerHTML = isRealtime
    ? '（实时版取最新动态数据，随成本BOM刷新；发布日期置灰不可选）'
    : '（仅成本经理、成本管理组组长、成本品牌组长、成本工程车型经理-管理员可选。默认只看每个项目最新一版）';
  updateNote();
}
function updateNote(){
  var src = document.getElementById('qSource');
  var label = src.options[src.selectedIndex].text;
  var rt = src.value === 'realtime';
  document.getElementById('verNote').innerHTML =
    '当前 Tab：<b>' + TAB_NAME[curTab] + '</b>　|　数据来源：<b>' + label + '</b>　|　项目代号：<b>' +
    document.getElementById('qProj').value + '</b>　|　' +
    (rt ? '实时版随成本BOM刷新同步，不展示数据更新时间' : '发布版为归档快照，冻结全部字段，每周归档一次') +
    '　|　切换 Tab 时筛选条件与已选值保持不变。';
}
function doSearch(){ updateNote(); render(); }
function resetSearch(){
  document.getElementById('qProj').value = 'T60-Y3';
  document.getElementById('qSource').value = 'release';
  onSourceChange();
}
function doExport(){ alert('已导出【整车成本达成情况报表】当前筛选结果（xlsx）'); }
function jump(name){ alert('跳转到：' + name); }

render();
onSourceChange();
</script>
</body>
</html>
